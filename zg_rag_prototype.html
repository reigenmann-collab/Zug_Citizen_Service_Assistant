<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parkieren-Assistent Stadt Zug – Prototyp</title>
<style>
:root{
  /* Tokens aus zg.ch (computed styles, 03.10.2026) */
  --primary-50:#eaebf0;--primary-100:#d5d7e6;--primary-500:#2d4487;--primary-600:#353f72;--primary-650:#435075;--primary-700:#2e335c;--primary-800:#252342;--primary-900:#150023;
  --secondary-500:#0070b8;--secondary-100:#d1e1f0;--secondary-50:#e8f0f7;
  --support-100:#f5f9ff;--support-300:#e0eef6;--support-500:#d1e1f0;--support-700:#7a8890;
  --accent-500:#e07031;--ok:#2f7d4f;--ok-bg:#e6f3ec;--warn:#9a5b00;--warn-bg:#fdf1dc;--err:#c53030;
  --text:#353f72;--head:#150023;--line:#d5d7e6;
  --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.55 var(--font);color:var(--text);background:#fff}
a{color:var(--secondary-500)}
h1,h2,h3{color:var(--head);margin:0;font-weight:700}
/* Header */
header{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:5}
.hd{max-width:1180px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:20px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--head);font-size:17px}
.logo svg{display:block}
.hd nav{margin-left:auto;display:flex;gap:22px;align-items:center}
.hd nav a{color:var(--text);text-decoration:none}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{border:0;background:#fff;color:var(--text);padding:5px 11px;font:inherit;cursor:pointer}
.lang button.on{background:var(--primary-650);color:#fff}
.crumb{max-width:1180px;margin:auto;padding:14px 20px 0;font-size:13px;color:var(--support-700)}
.crumb a{color:var(--text)}
/* Layout */
main{max-width:1180px;margin:auto;padding:10px 20px 40px}
.title{padding:18px 0 22px}
.title h1{font-size:34px;line-height:1.15}
.title p{max-width:720px;margin:10px 0 0;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
.grid.nostaff{grid-template-columns:1fr}.grid.nostaff aside{display:none}
@media(max-width:900px){.grid{grid-template-columns:1fr}.hd nav a.nl{display:none}.title h1{font-size:26px}}
/* Chat */
.chat{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.msgs{padding:20px;min-height:380px;max-height:620px;overflow:auto;display:flex;flex-direction:column;gap:16px;background:var(--support-100)}
.m{max-width:88%;padding:12px 15px;border-radius:12px}
.m.u{align-self:flex-end;background:var(--primary-650);color:#fff;border-bottom-right-radius:3px}
.m.b{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:3px;color:var(--head)}
.m.b p{margin:0 0 8px}.m.b p:last-child{margin:0}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--primary-50);color:var(--primary-700)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.warn{background:var(--warn-bg);color:var(--warn)}
.src{margin-top:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:13px}
.src h4{margin:0;padding:7px 12px;background:var(--support-300);color:var(--head);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.src a{display:flex;gap:10px;align-items:baseline;padding:8px 12px;border-top:1px solid var(--line);text-decoration:none;color:var(--secondary-500)}
.src a:hover{background:var(--support-100)}
.src small{color:var(--support-700);margin-left:auto;white-space:nowrap}
.legal{margin-top:10px;padding:8px 10px;font-size:12px;border-radius:6px;background:var(--support-300);color:var(--primary-700)}
.esc{border-left:4px solid var(--accent-500);background:var(--warn-bg);padding:12px 14px;border-radius:6px;margin-top:10px;color:var(--head)}
.esc button{margin-top:8px}
.btn{border:0;background:var(--primary-650);color:#fff;padding:10px 20px;border-radius:6px;font:600 14px var(--font);cursor:pointer}
.btn:hover{background:var(--primary-700)}
.btn.sec{background:#fff;color:var(--primary-650);border:1px solid var(--primary-650)}
.sugg{padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line)}
.sugg button{border:1px solid var(--primary-200,#abb3cc);background:#fff;color:var(--text);padding:6px 12px;border-radius:99px;font:inherit;cursor:pointer}
.sugg button:hover{background:var(--support-300)}
form{display:flex;gap:0;padding:14px 20px;border-top:1px solid var(--line)}
form input{flex:1;font:16px var(--font);color:var(--text);padding:13px 16px;border:1px solid var(--line);border-right:0;border-radius:8px 0 0 8px;outline:none}
form input:focus{border-color:var(--primary-500)}
form .btn{border-radius:0 8px 8px 0;padding:0 26px}
.note{padding:0 20px 14px;font-size:12px;color:var(--support-700)}
/* Staff panel */
aside .card{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;background:#fff}
aside h3{font-size:15px;margin-bottom:10px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--primary-800);padding:2px 8px;border-radius:4px;margin-bottom:10px}
.bar{display:grid;grid-template-columns:96px 1fr 38px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.bar i{display:block;height:8px;border-radius:4px;background:var(--primary-50);overflow:hidden}
.bar i b{display:block;height:100%;background:var(--secondary-500)}
.thr{display:flex;justify-content:space-between;font-size:13px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.kv{font-size:13px}.kv div{display:flex;justify-content:space-between;padding:3px 0}
.empty{color:var(--support-700);font-size:13px}
footer{background:var(--primary-800);color:#fff;margin-top:20px}
footer div{max-width:1180px;margin:auto;padding:24px 20px;display:flex;gap:24px;flex-wrap:wrap;font-size:13px}
footer a{color:#fff}
.proto{background:var(--accent-500);color:#fff;text-align:center;padding:6px 10px;font-size:13px;font-weight:600}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;margin:0 0 12px;justify-content:flex-end}
</style>
</head>
<body>
<div class="proto" id="protoBar"></div>
<header>
  <div class="hd">
    <a class="logo" href="#" aria-label="Stadt Zug">
      <!-- Platzhalter-Wortmarke (nicht das offizielle Logo) -->
      <svg width="36" height="26" viewBox="0 0 36 26" aria-hidden="true"><rect y="0" width="36" height="2" fill="#0070b8"/><rect y="7" width="36" height="2" fill="#0070b8"/><rect y="14" width="36" height="12" fill="#0070b8"/></svg>
      <span>Stadt Zug</span>
    </a>
    <nav>
      <a class="nl" href="#" data-i="nav1"></a>
      <a class="nl" href="#" data-i="nav2"></a>
      <div class="lang"><button id="bde" class="on">DE</button><button id="ben">EN</button></div>
    </nav>
  </div>
  <div class="crumb"><a href="#" data-i="c1"></a> › <a href="#" data-i="c2"></a> › <span data-i="c3"></span></div>
</header>

<main>
  <div class="title">
    <h1 data-i="h1"></h1>
    <p data-i="lead"></p>
  </div>
  <label class="toggle"><input type="checkbox" id="staff" checked> <span data-i="staffToggle"></span></label>
  <div class="grid" id="grid">
    <section class="chat" aria-label="Chat">
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <div class="sugg" id="sugg"></div>
      <form id="f">
        <input id="q" autocomplete="off" data-ph="ph">
        <button class="btn" data-i="send"></button>
      </form>
      <div class="note" data-i="note"></div>
    </section>

    <aside>
      <span class="tag" data-i="staffTag"></span>
      <div class="card"><h3 data-i="confH"></h3><div id="conf"><p class="empty" data-i="emptyConf"></p></div></div>
      <div class="card"><h3 data-i="pipeH"></h3><div id="pipe" class="kv"><p class="empty" data-i="emptyConf"></p></div></div>
      <div class="card"><h3 data-i="corpH"></h3>
        <div class="kv">
          <div><span data-i="k1"></span><b>Reglemente SRS 7.7.5</b></div>
          <div><span data-i="k2"></span><b>Webseite Parkieren</b></div>
          <div><span data-i="k3"></span><b>Online-Parkkartenschalter</b></div>
          <div><span data-i="k4"></span><b>Chroma (lokal)</b></div>
        </div>
      </div>
    </aside>
  </div>
</main>
<footer><div>
  <span data-i="foot1"></span><a href="#" data-i="foot2"></a><a href="#" data-i="foot3"></a><a href="#" data-i="foot4"></a>
</div></footer>

<script>
const T={
de:{
 proto:"PROTOTYP · Inhalte von stadtzug.ch/mobilitaet/parkieren, keine Live-Anbindung · Design angelehnt an zg.ch",
 nav1:"Themen",nav2:"Organisation",c1:"Stadt Zug",c2:"Mobilität",c3:"Parkieren",
 h1:"Parkieren in der Stadt Zug",
 lead:"Stellen Sie Ihre Frage zu Parkkarten, Parkgebühren und Verordnungen in eigenen Worten. Sie erhalten eine Antwort mit Quellenangaben aus den offiziellen Dokumenten.",
 staffToggle:"Pilot-Ansicht (Verwaltung) einblenden",staffTag:"Pilot-Ansicht",
 confH:"Konfidenz",pipeH:"Pipeline-Details",corpH:"Wissensbasis",emptyConf:"Noch keine Anfrage.",
 k1:"Quelle 1",k2:"Quelle 2",k3:"Quelle 3",k4:"Vector Store",
 ph:"Was möchten Sie wissen?",send:"Fragen",
 note:"Dieser Assistent liefert Informationen, keine rechtsverbindlichen Entscheide. Antworten können Fehler enthalten – massgebend sind die verlinkten Originaldokumente.",
 hello:"Grüezi! Ich beantworte Fragen rund ums Parkieren in der Stadt Zug – zum Beispiel zu Anwohnerparkkarten, Gebühren oder Formularen. Womit kann ich helfen?",
 sg:["Wie bekomme ich eine Anwohnerparkkarte?","Was kostet eine Anwohnerparkkarte?","Gibt es Parkkarten für Besuchende?","Was kostet eine Gewerbeparkkarte?","Kann ich gegen eine Parkbusse Einsprache erheben?"],
 srcH:"Quellen",doc:"Dokument",
 conf:"Konfidenz",ok:"Direkt beantwortet",esc:"An Sachbearbeitung weitergeleitet",
 escT:"Diese Frage kann ich nicht sicher beantworten. Ich habe sie mit einer Zusammenfassung an die zuständige Stelle weitergeleitet.",escB:"Kontakt anzeigen",
 s1:"Retrieval",s2:"Quellentreue",s3:"Selbstbewertung",thr:"Schwelle",comp:"Gesamt",
 p1:"Sprache",p2:"Treffer (Top-k)",p3:"Coverage-Check",p4:"Routing",p5:"Antwortzeit",
 foot1:"© Kanton Zug · Prototyp",foot2:"Impressum",foot3:"Datenschutz",foot4:"Barrierefreiheit",
 thinking:"Suche in Dokumenten …",legal:"",
 A:{
  park:{t:["Anwohnende in den Quartieren der Stadt Zug beantragen die Parkkarte über den Online-Parkkartenschalter. Sie erlaubt, werktags (Mo–Fr, 7–19 Uhr) länger als 120 Minuten in Ihrer Zone zu parken.","Die Karte ist zonengebunden. Karten gibt es für die Zonen 1–3 und 5–10; in Zone 4 werden keine Karten ausgegeben."],src:[["Parkieren – Parkkarten für Anwohnende (stadtzug.ch)", "Webseite · Abschnitt Quartiere"],["Online-Parkkartenschalter", "Antrag online"]],c:[.92,.94,.86],d:true},
  fee:{t:["Die Parkkarte für Anwohnende kostet CHF 30.– pro Monat."],src:[["Parkieren – Parkkarten für Anwohnende (stadtzug.ch)", "Webseite · Abschnitt Quartiere"],["Reglement SRS 7.7.5-2 (zug.tlex.ch)", "Rechtstext"]],c:[.90,.93,.84],d:true},
  visit:{t:["Für Gäste können Anwohnende Tageskarten zu CHF 5.– pro Tag kaufen."],src:[["Parkieren – Parkkarten für Anwohnende (stadtzug.ch)", "Webseite · Abschnitt Quartiere"]],c:[.89,.91,.82],d:true},
  comm:{t:["Die Gewerbeparkkarte kostet CHF 6.– pro Tag, CHF 60.– pro Monat oder CHF 600.– pro Jahr und gilt in allen Gemeinden des Kantons."],src:[["Parkieren – Gewerbeparkkarte (stadtzug.ch)", "Webseite"]],c:[.87,.90,.80],d:true},
  esc:{c:[.41,.38,.55],d:false}
 },
 lang:"Deutsch",route:"Hard-Routing: Rechtsmittel"
},
en:{
 proto:"PROTOTYPE · Content from stadtzug.ch/mobilitaet/parkieren, no live backend · Design inspired by zg.ch",
 nav1:"Topics",nav2:"Organisation",c1:"City of Zug",c2:"Mobility",c3:"Parking",
 h1:"Parking in the City of Zug",
 lead:"Ask about parking permits, fees and regulations in your own words. You get an answer with references to the official documents.",
 staffToggle:"Show pilot view (administration)",staffTag:"Pilot view",
 confH:"Confidence",pipeH:"Pipeline details",corpH:"Knowledge base",emptyConf:"No query yet.",
 k1:"Source 1",k2:"Source 2",k3:"Source 3",k4:"Vector store",
 ph:"What would you like to know?",send:"Ask",
 note:"This assistant provides information, not legally binding decisions. Answers may contain errors – the linked original documents are authoritative.",
 hello:"Hello! I answer questions about parking in the City of Zug – e.g. resident permits, fees or forms. How can I help?",
 sg:["How do I obtain a resident parking permit?","How much does a resident permit cost?","Are there permits for visitors?","How much is a commercial permit?","Can I appeal a parking fine?"],
 srcH:"Sources",doc:"Document",
 conf:"Confidence",ok:"Answered directly",esc:"Escalated to staff",
 escT:"I can't answer this reliably. I've forwarded it with a summary to the responsible office.",escB:"Show contact",
 s1:"Retrieval",s2:"Grounding",s3:"Self-eval",thr:"Threshold",comp:"Composite",
 p1:"Language",p2:"Hits (top-k)",p3:"Coverage check",p4:"Routing",p5:"Latency",
 foot1:"© Canton of Zug · Prototype",foot2:"Imprint",foot3:"Privacy",foot4:"Accessibility",
 thinking:"Searching documents …",legal:"This English answer is a convenience translation and is not legally binding. The official language is German; the German source documents are authoritative.",
 A:{
  park:{t:["Residents of the Stadt Zug neighbourhoods apply for the permit through the online parking permit portal. It allows parking longer than 120 minutes on weekdays (Mon–Fri, 7 am–7 pm) in your zone.","The permit is zone-specific. Permits exist for zones 1–3 and 5–10; no permits are issued in zone 4."],src:[["Parking – resident permits (stadtzug.ch)", "Web page · Neighbourhoods section"],["Online parking permit portal", "Apply online"]],c:[.92,.94,.86],d:true},
  fee:{t:["The resident parking permit costs CHF 30.– per month."],src:[["Parking – resident permits (stadtzug.ch)", "Web page · Neighbourhoods section"],["Regulation SRS 7.7.5-2 (zug.tlex.ch)", "Legal text"]],c:[.90,.93,.84],d:true},
  visit:{t:["Residents can buy day passes for guests at CHF 5.– per day."],src:[["Parking – resident permits (stadtzug.ch)", "Web page · Neighbourhoods section"]],c:[.89,.91,.82],d:true},
  comm:{t:["The commercial permit costs CHF 6.– per day, CHF 60.– per month or CHF 600.– per year and is valid in all municipalities of the canton."],src:[["Parking – commercial permit (stadtzug.ch)", "Web page"]],c:[.87,.90,.80],d:true},
  esc:{c:[.41,.38,.55],d:false}
 },
 lang:"English",route:"Hard routing: legal remedy"
}};
const W=[.3,.5,.2], THR=.82; // Platzhalter-Gewichte/Schwelle
let L='de';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function render(){
  const t=T[L];document.documentElement.lang=L;
  $$('[data-i]').forEach(e=>e.textContent=t[e.dataset.i]);
  $('#q').placeholder=t.ph;$('#protoBar').textContent=t.proto;
  $('#bde').classList.toggle('on',L==='de');$('#ben').classList.toggle('on',L==='en');
  $('#sugg').innerHTML='';t.sg.forEach(s=>{const b=document.createElement('button');b.type='button';b.textContent=s;b.onclick=()=>ask(s);$('#sugg').appendChild(b)});
  $('#msgs').innerHTML='';bot(`<p>${t.hello}</p>`);
  $('#conf').innerHTML=`<p class="empty">${t.emptyConf}</p>`;$('#pipe').innerHTML=`<p class="empty">${t.emptyConf}</p>`;
}
function user(txt){const d=document.createElement('div');d.className='m u';d.textContent=txt;$('#msgs').appendChild(d);scroll()}
function bot(html){const d=document.createElement('div');d.className='m b';d.innerHTML=html;$('#msgs').appendChild(d);scroll();return d}
function scroll(){const m=$('#msgs');m.scrollTop=m.scrollHeight}
function classify(q){q=q.toLowerCase();
  if(/einsprache|rekurs|busse|bussen|appeal|fine|haft|liab/.test(q))return'esc';
  if(/gewerbe|commercial|trade/.test(q))return'comm';
  if(/besuch|gast|gäste|visitor|guest/.test(q))return'visit';
  if(/kost|gebühr|preis|cost|fee|price|much/.test(q))return'fee';
  if(/anwohner|parkkarte|permit|resident|zone/.test(q))return'park';
  return'esc';}
function ask(q){
  q=q.trim();if(!q)return;const t=T[L];user(q);$('#q').value='';
  const k=classify(q),a=t.A[k],th=bot(`<p class="empty">${t.thinking}</p>`);
  setTimeout(()=>{
    const c=a.c,C=c[0]*W[0]+c[1]*W[1]+c[2]*W[2],ok=a.d&&C>=THR&&k!=='esc';
    let h='';
    if(ok){
      h=a.t.map(p=>`<p>${p}</p>`).join('')+
        `<div class="src"><h4>${t.srcH}</h4>${a.src.map(s=>`<a href="#"><span>📄 ${s[0]}</span><small>${s[1]}</small></a>`).join('')}</div>
         <div class="badges"><span class="badge ok">${t.conf} ${Math.round(C*100)}%</span><span class="badge">${t.ok}</span></div>`;
    }else{
      h=`<div class="esc"><b>${t.esc}</b><br>${t.escT}<br><button class="btn sec" type="button">${t.escB}</button></div>
         <div class="badges"><span class="badge warn">${t.conf} ${Math.round(C*100)}%</span></div>`;
    }
    if(L==='en')h+=`<div class="legal">ⓘ ${t.legal}</div>`;
    th.innerHTML=h;scroll();
    const rows=[[t.s1,c[0]],[t.s2,c[1]],[t.s3,c[2]]].map(r=>`<div class="bar"><span>${r[0]}</span><i><b style="width:${r[1]*100}%"></b></i><span>${r[1].toFixed(2)}</span></div>`).join('');
    $('#conf').innerHTML=rows+`<div class="thr"><span>${t.comp}</span><b>${C.toFixed(2)}</b></div><div class="thr" style="border:0;margin:0;padding:0"><span>${t.thr}</span><b>${THR.toFixed(2)}</b></div>`;
    $('#pipe').innerHTML=[[t.p1,t.lang],[t.p2,ok?'k = 5 / 3 Docs':'k = 5 / 1 Doc'],[t.p3,ok?'✓':'✗'],[t.p4,k==='esc'&&/einsprache|appeal|busse|fine/i.test(q)?t.route:(ok?'—':'Confidence')],[t.p5,(ok?'2.4':'1.1')+' s']].map(r=>`<div><span>${r[0]}</span><b>${r[1]}</b></div>`).join('');
  },700);
}
$('#f').onsubmit=e=>{e.preventDefault();ask($('#q').value)};
$('#bde').onclick=()=>{L='de';render()};$('#ben').onclick=()=>{L='en';render()};
$('#staff').onchange=e=>$('#grid').classList.toggle('nostaff',!e.target.checked);
render();
</script>
</body>
</html>
